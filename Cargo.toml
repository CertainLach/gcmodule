[workspace.package]
version = "0.4.3"
authors = ["Jun Wu <quark@lihdd.net>", "Yaroslav Bolyukin <iam@lach.pw>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/CertainLach/gcmodule"

[package]
name = "jrsonnet-gcmodule"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cyclic garbage collection inspired by CPython's gc implementation."
keywords = ["gc", "garbage", "cycle", "rc"]
categories = ["memory-management"]
readme = "README.md"

[dev-dependencies]
quickcheck = { version = "1.0", default-features = false }

[dependencies]
jrsonnet-gcmodule-derive = { version = "0.4.3", optional = true, path = "gcmodule_derive" }

im-rc = { version = "15.1.0", optional = true }
parking_lot = { version = "0.12.5", optional = true }
rustc-hash = { version = "2.1.1", optional = true }

[features]
default = ["derive"]
debug = []
derive = ["jrsonnet-gcmodule-derive"]
nightly = []
sync = ["parking_lot"]
testutil = []
rustc-hash = ["dep:rustc-hash"]
im-rc = ["dep:im-rc"]

[workspace]
members = ["gcmodule_derive", "fuzz"]
